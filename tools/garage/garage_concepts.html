<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Redline Rush — Garage Concepts</title>
<meta name="theme-color" content="#0d6a42">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@500;700&display=swap">
<style>
/* A dark studio turntable for each car; UI borrows the game's highway-sign green, amber and type. */
:root{
  --sign:#0d6a42;--sign-deep:#08482c;--sign-line:#f3f5ef;--ink:#f3f5ef;--muted:#b5c4ba;--amber:#f5b52e;
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--f-body:'Overpass',system-ui,-apple-system,sans-serif;--f-mono:'Overpass Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0b0d10;color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;transition:opacity .15s}
#gl:active{cursor:grabbing}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 18px) 0 calc(env(safe-area-inset-left) + 18px);pointer-events:none}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.eyebrow b{color:var(--amber);font-weight:700}
h1{margin:2px 0 0;font-family:var(--f-display);font-weight:900;font-size:clamp(38px,9vw,64px);line-height:.92;letter-spacing:.01em;text-transform:uppercase}
.tag{margin-top:6px;display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:var(--sign);color:var(--ink);padding:4px 8px 3px;border-radius:4px;box-shadow:0 0 0 2px var(--sign-line) inset}
.tag.boss{background:#5a1717}
#panel{position:fixed;left:0;right:0;bottom:0;padding:0 0 calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
#panel>*{pointer-events:auto}
.row{display:flex;gap:8px;align-items:center;padding:0 calc(env(safe-area-inset-right) + 14px) 0 calc(env(safe-area-inset-left) + 14px)}
#views{display:flex;background:rgba(8,11,13,.62);border-radius:999px;padding:3px;gap:2px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#views button{border:0;background:transparent;color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px 8px 6px;border-radius:999px;cursor:pointer}
@media (max-width:420px){#views button{padding:8px 6px 6px;font-size:10px}#notesBtn{padding:9px 9px 7px;font-size:10px}}

#views button[aria-pressed="true"]{background:var(--sign-line);color:#0b2a1b}
#notesBtn{margin-left:auto;border:0;background:rgba(8,11,13,.62);color:var(--ink);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 12px 7px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
#notesBtn::after{content:' +';color:var(--amber)}
#panel.open #notesBtn::after{content:' −'}
.notes{display:none;margin:0 calc(env(safe-area-inset-right) + 14px) 0 calc(env(safe-area-inset-left) + 14px);background:var(--sign);border-radius:12px;box-shadow:0 0 0 2px var(--sign-line) inset,0 10px 30px rgba(0,0,0,.45);padding:14px 16px 12px;max-height:46vh;overflow:auto}
#panel.open .notes{display:block}
.notes p{margin:0 0 10px;font-size:14px;line-height:1.4}
.cues{display:grid;gap:2px;margin-bottom:10px}
.cues span{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.cues b{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em;line-height:1.05}
#cNotes{margin:0 0 10px;padding-left:18px;font-size:13px;line-height:1.45;color:#e2ebe5}
#cNotes li{margin-bottom:3px}
#cStats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px}
.st{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.st i{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--amber) calc(var(--v)*100%),rgba(255,255,255,.18) 0)}
.st b{color:var(--ink);font-weight:700}
#strip{display:flex;gap:6px;overflow-x:auto;padding:2px calc(env(safe-area-inset-right) + 14px) 4px calc(env(safe-area-inset-left) + 14px);scrollbar-width:none;align-items:center}
#strip::-webkit-scrollbar{display:none}
.grp{flex:none;font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);padding:0 2px;opacity:.8}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:0;border-radius:10px;background:rgba(8,11,13,.66);color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.03em;text-transform:uppercase;padding:9px 12px 7px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip i{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.chip[aria-pressed="true"]{background:var(--sign);box-shadow:0 0 0 2px var(--sign-line) inset}
#fallback[hidden]{display:none}
#fallback{position:fixed;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:var(--muted)}
@media (min-width:1100px){.notes{position:fixed;right:calc(env(safe-area-inset-right) + 18px);top:calc(env(safe-area-inset-top) + 18px);width:340px;max-height:none;margin:0;display:block}#notesBtn{display:none}}
</style>
</head>
<body>
<canvas id="gl" aria-label="3D car viewer. Drag to orbit, pinch to zoom."></canvas>
<header class="top">
  <div class="eyebrow">Redline Rush · <b>Garage concepts</b></div>
  <h1 id="cName">Kestrel</h1>
  <div id="cTag" class="tag"></div>
</header>
<section id="panel">
  <div class="notes" id="notes">
    <p id="cBlurb"></p>
    <div class="cues"><span>Real-world references</span><b id="cCues"></b></div>
    <ul id="cNotes"></ul>
    <div id="cStats"></div>
  </div>
  <div class="row">
    <nav id="views" aria-label="Camera">
      <button data-v="3/4" aria-pressed="true">3/4</button><button data-v="chase">Chase</button><button data-v="side">Side</button><button data-v="front">Front</button><button data-v="rear">Rear</button><button data-v="inside">Inside</button>
    </nav>
    <button id="notesBtn" aria-expanded="false" aria-controls="notes">Notes</button>
  </div>
  <div id="strip" role="tablist" aria-label="Cars"></div>
</section>
<div id="fallback" hidden>This viewer needs WebGL 2, which this browser doesn't have turned on.</div>
<script>
'use strict';
/* ============================================================
   Redline Rush — garage concept renderer
   Procedural car modeller (lofted bodies, greenhouses, wheels,
   projected light/grille decals) + a small WebGL2 studio renderer.
   ============================================================ */

// ---------- math ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const vsub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], vadd=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const vmul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s], vdot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const vcross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const vnorm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];};
function hexLin(h){const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255].map(c=>Math.pow(c/255,2.2));}
function m4persp(fov,asp,n,f){const t=1/Math.tan(fov/2);return new Float32Array([t/asp,0,0,0,0,t,0,0,0,0,(f+n)/(n-f),-1,0,0,2*f*n/(n-f),0]);}
function m4look(e,c,u){const z=vnorm(vsub(e,c)),x=vnorm(vcross(u,z)),y=vcross(z,x);
  return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-vdot(x,e),-vdot(y,e),-vdot(z,e),1]);}
function m4mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;}
// 3x3 row-major helpers
const M3={
  I:()=>[1,0,0,0,1,0,0,0,1],
  rx:a=>{const c=Math.cos(a),s=Math.sin(a);return [1,0,0,0,c,-s,0,s,c];},
  ry:a=>{const c=Math.cos(a),s=Math.sin(a);return [c,0,s,0,1,0,-s,0,c];},
  rz:a=>{const c=Math.cos(a),s=Math.sin(a);return [c,-s,0,s,c,0,0,0,1];},
  sc:(x,y,z)=>[x,0,0,0,y,0,0,0,z],
  mul:(a,b)=>{const o=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)o[r*3+c]=a[r*3]*b[c]+a[r*3+1]*b[3+c]+a[r*3+2]*b[6+c];return o;},
  // columns = basis vectors u,v,w (maps local x,y,z to them)
  basis:(u,v,w)=>[u[0],v[0],w[0],u[1],v[1],w[1],u[2],v[2],w[2]]
};

// monotone cubic interpolation through [[x,y],...]
function curve(pts){
  const n=pts.length,xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  if(n===1)return()=>ys[0];
  const d=[],m=new Array(n);
  for(let i=0;i<n-1;i++)d[i]=(ys[i+1]-ys[i])/(xs[i+1]-xs[i]);
  m[0]=d[0];m[n-1]=d[n-2];
  for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=m[i+1]=0;continue;}const a=m[i]/d[i],b=m[i+1]/d[i],s=a*a+b*b;if(s>9){const t=3/Math.sqrt(s);m[i]=t*a*d[i];m[i+1]=t*b*d[i];}}
  return x=>{
    if(x<=xs[0])return ys[0]+m[0]*(x-xs[0])*0; if(x>=xs[n-1])return ys[n-1];
    let lo=0,hi=n-1;while(hi-lo>1){const mid=(lo+hi)>>1;if(xs[mid]>x)hi=mid;else lo=mid;}
    const h=xs[hi]-xs[lo],t=(x-xs[lo])/h,t2=t*t,t3=t2*t;
    return (2*t3-3*t2+1)*ys[lo]+(t3-2*t2+t)*h*m[lo]+(-2*t3+3*t2)*ys[hi]+(t3-t2)*h*m[hi];
  };
}

// ---------- mesh parts ----------
class Part{
  constructor(mat){this.mat=mat;this.P=[];this.N=[];this.M=[];this.T=[];this.I=[];}
  get count(){return this.P.length/3;}
  v(x,y,z,u=0,w=0){this.P.push(x,y,z);this.N.push(0,0,0);this.M.push(-1,-1,-1);this.T.push(u,w);return this.P.length/3-1;}
  q(a,b,c,d){this.I.push(a,b,c,a,c,d);}
  t(a,b,c){this.I.push(a,b,c);}
  normals(){const P=this.P,N=this.N,I=this.I;N.fill(0);
    for(let i=0;i<I.length;i+=3){const a=I[i]*3,b=I[i+1]*3,c=I[i+2]*3;
      const e1x=P[b]-P[a],e1y=P[b+1]-P[a+1],e1z=P[b+2]-P[a+2],e2x=P[c]-P[a],e2y=P[c+1]-P[a+1],e2z=P[c+2]-P[a+2];
      const nx=e1y*e2z-e1z*e2y,ny=e1z*e2x-e1x*e2z,nz=e1x*e2y-e1y*e2x;
      N[a]+=nx;N[a+1]+=ny;N[a+2]+=nz;N[b]+=nx;N[b+1]+=ny;N[b+2]+=nz;N[c]+=nx;N[c+1]+=ny;N[c+2]+=nz;}
    for(let i=0;i<N.length;i+=3){const l=Math.hypot(N[i],N[i+1],N[i+2])||1;N[i]/=l;N[i+1]/=l;N[i+2]/=l;}
    return this;}
  flip(){const I=this.I;for(let i=0;i<I.length;i+=3){const t=I[i+1];I[i+1]=I[i+2];I[i+2]=t;}for(let i=0;i<this.N.length;i++)this.N[i]=-this.N[i];return this;}
  orientOut(c){let s=0;const P=this.P,N=this.N;for(let i=0;i<P.length;i+=3)s+=N[i]*(P[i]-c[0])+N[i+1]*(P[i+1]-c[1])+N[i+2]*(P[i+2]-c[2]);if(s<0)this.flip();return this;}
  xf(m,t=[0,0,0],from=0){const P=this.P,N=this.N;
    for(let i=from*3;i<P.length;i+=3){const x=P[i],y=P[i+1],z=P[i+2];
      P[i]=m[0]*x+m[1]*y+m[2]*z+t[0];P[i+1]=m[3]*x+m[4]*y+m[5]*z+t[1];P[i+2]=m[6]*x+m[7]*y+m[8]*z+t[2];
      const a=N[i],b=N[i+1],c=N[i+2];N[i]=m[0]*a+m[1]*b+m[2]*c;N[i+1]=m[3]*a+m[4]*b+m[5]*c;N[i+2]=m[6]*a+m[7]*b+m[8]*c;}
    return this;}
  append(o){const base=this.count;for(const [a,b] of [[this.P,o.P],[this.N,o.N],[this.M,o.M],[this.T,o.T]])for(let i=0;i<b.length;i++)a.push(b[i]);for(let i=0;i<o.I.length;i++)this.I.push(o.I[i]+base);return this;}
  clone(){const p=new Part(this.mat);p.P=this.P.slice();p.N=this.N.slice();p.M=this.M.slice();p.T=this.T.slice();p.I=this.I.slice();return p;}
}
function grid(part,rows,cols,fn,closeCols=false){
  const base=part.count;
  for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){const p=fn(i,j);part.v(p[0],p[1],p[2],p[3]||0,p[4]||0);}
  for(let i=0;i<rows-1;i++)for(let j=0;j<(closeCols?cols:cols-1);j++){const j2=(j+1)%cols;
    part.q(base+i*cols+j,base+i*cols+j2,base+(i+1)*cols+j2,base+(i+1)*cols+j);}
  return base;
}
// revolve [[r,z],...] around local z axis
function lathe(mat,prof,segs=48){const p=new Part(mat);
  grid(p,prof.length,segs,(i,j)=>{const a=j/segs*Math.PI*2,r=prof[i][0];return [r*Math.cos(a),r*Math.sin(a),prof[i][1],j/segs,i/(prof.length-1)];},true);
  return p.normals();}
const sp=(v,e)=>Math.sign(v)*Math.pow(Math.abs(v),e);
// superellipsoid "rounded box" centred at origin, half extents hx,hy,hz; e small = boxy
function rbox(mat,hx,hy,hz,e=.3,nu=10,nv=20){
const p=new Part(mat);
  grid(p,nu+1,nv,(i,j)=>{const ph=-Math.PI/2+Math.PI*i/nu,th=-Math.PI+2*Math.PI*j/nv;
    const cp=Math.cos(ph);return [hx*sp(cp,e)*sp(Math.cos(th),e),hy*sp(Math.sin(ph),e),hz*sp(cp,e)*sp(Math.sin(th),e)];},true);
  return p.normals();}
// cylinder between two points (with caps)
function cyl(mat,p0,p1,r0,r1=r0,segs=20,caps=true){
  const d=vsub(p1,p0),L=Math.hypot(...d),w=vnorm(d);
  const prof=caps?[[0,0],[r0,0],[r0,0],[r1,L],[r1,L],[0,L]]:[[r0,0],[r1,L]];
  const p=lathe(mat,prof,segs);const a=Math.abs(w[1])<.9?[0,1,0]:[1,0,0];const u=vnorm(vcross(a,w)),v=vcross(w,u);
  return p.xf(M3.basis(u,v,w),p0);}
// extrude closed 2D polygon (a,b) along local z from z0 to z1; smooth = smooth side normals
function extrude(mat,poly,z0,z1,smooth=true){const p=new Part(mat),n=poly.length;
  if(smooth){grid(p,2,n,(i,j)=>[poly[j][0],poly[j][1],i?z1:z0],true);}
  else{for(let j=0;j<n;j++){const a=poly[j],b=poly[(j+1)%n],s=p.count;p.v(a[0],a[1],z0);p.v(b[0],b[1],z0);p.v(b[0],b[1],z1);p.v(a[0],a[1],z1);p.q(s,s+1,s+2,s+3);}}
  for(const z of [z0,z1]){let cx=0,cy=0;for(const q of poly){cx+=q[0];cy+=q[1];}cx/=n;cy/=n;const c=p.v(cx,cy,z),s=p.count;for(const q of poly)p.v(q[0],q[1],z);for(let j=0;j<n;j++)p.t(c,s+j,s+(j+1)%n);}
  return p.normals();}
function mirrorZ(part){return part.clone().xf(M3.sc(1,1,-1));}

// ---------- 2D shape helpers (decal outlines) ----------
// rounded polygon: pts [[u,v],...], radius r (number or array)
function pg(pts,r=0,seg=5){const out=[],n=pts.length;
  for(let i=0;i<n;i++){const p=pts[i],a=pts[(i+n-1)%n],b=pts[(i+1)%n],rr=Array.isArray(r)?r[i]:r;
    if(!rr){out.push(p);continue;}
    const da=Math.hypot(a[0]-p[0],a[1]-p[1]),db=Math.hypot(b[0]-p[0],b[1]-p[1]),k=Math.min(rr,da*.45,db*.45);
    const p0=[p[0]+(a[0]-p[0])/da*k,p[1]+(a[1]-p[1])/da*k],p1=[p[0]+(b[0]-p[0])/db*k,p[1]+(b[1]-p[1])/db*k];
    for(let s=0;s<=seg;s++){const t=s/seg,u=1-t;out.push([u*u*p0[0]+2*u*t*p[0]+t*t*p1[0],u*u*p0[1]+2*u*t*p[1]+t*t*p1[1]]);}}
  return out;}
const rr=(cu,cv,w,h,r=.01,skew=0)=>pg([[cu-w/2,cv-h/2],[cu+w/2,cv-h/2],[cu+w/2+skew,cv+h/2],[cu-w/2+skew,cv+h/2]],r);
const el=(cu,cv,rx,ry=rx,n=28)=>Array.from({length:n},(_,i)=>{const a=i/n*Math.PI*2;return [cu+rx*Math.cos(a),cv+ry*Math.sin(a)];});
// signed distance to polygon (positive inside)
function polySd(px,py,pts){let d=Infinity,s=1;const n=pts.length;
  for(let i=0,j=n-1;i<n;j=i++){const ax=pts[j][0],ay=pts[j][1],bx=pts[i][0],by=pts[i][1];
    const ex=bx-ax,ey=by-ay,wx=px-ax,wy=py-ay,t=clamp((wx*ex+wy*ey)/(ex*ex+ey*ey),0,1);
    const dx=wx-ex*t,dy=wy-ey*t;d=Math.min(d,dx*dx+dy*dy);
    const c1=py>=ay,c2=py<by,c3=ex*wy>ey*wx;if((c1&&c2&&c3)||(!c1&&!c2&&!c3))s=-s;}
  return -s*Math.sqrt(d);}
const band=(v,a,b)=>Math.min(v-a,b-v);
const U=Math.max,X=Math.min;

// distance helper for wheel-arch trims (positive within w of the arch edge)
function archSd(x,y,api,w){let d=-1;
  for(const a of api.arches){const r=Math.hypot(x-a.x,y-a.cy);d=Math.max(d,X(a.Ra+w-r,r-a.Ra+.004));}
  return d;}
// resample a polyline [[y,z],...] to n+1 points, evenly by arc length (a little extra density in tight bends)
function resample(pts,n,bend=.05,wfn=null){
  const cum=[0];
  for(let i=1;i<pts.length;i++){let ds=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);let da=0;if(wfn)ds*=wfn(pts[i]);
    if(i>1){const a1=Math.atan2(pts[i-1][0]-pts[i-2][0],pts[i-1][1]-pts[i-2][1]),a2=Math.atan2(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);da=Math.abs(Math.atan2(Math.sin(a2-a1),Math.cos(a2-a1)));}
    cum.push(cum[i-1]+ds+bend*da);}
  const tot=cum[cum.length-1],out=[];let k=0;
  for(let j=0;j<=n;j++){const sv=tot*j/n;while(k<pts.length-2&&cum[k+1]<sv)k++;const t=clamp((sv-cum[k])/((cum[k+1]-cum[k])||1),0,1);

    const M=C.mats,gasket=.011-Math.abs(glass),belt=X(C.belt-g,-u,x-(x0+.05));
    let trim=U(M.a==='trim'?sdA:-1,M.c==='trim'?sdCc:-1,M.b==='trim'?sdB:-1,M.roof==='trim'||M.roof==='glass'?roofP:-1);
    let acc=-1;
    if(C.chrome)acc=U(gasket,belt);else trim=U(trim,gasket,belt);
    if(C.accentFn)acc=U(acc,C.accentFn(q[0],q[1],q[2],u));
    p.M[i*3]=glass;p.M[i*3+1]=trim;p.M[i*3+2]=acc;}
  const wbAt=x=>{if(x<=XS[0])return WB[0];if(x>=XS[XS.length-1])return WB[WB.length-1];let i=1;while(XS[i]<x)i++;return lerp(WB[i-1],WB[i],(x-XS[i-1])/(XS[i]-XS[i-1]));};
  // inner surface of the greenhouse at height y (for placing mirrors, visors, checking head room)
  const innerAt=(x,y)=>{const base=baseY(x),h=Math.max(roofF(x)-base,1e-4),cy=clamp((y-base)/h,0,1),wb=wbAt(x),wt=wb-C.tumble*clamp(h/.42,0,1);

  return {cabin:p,roofF,baseY,x0,x1,wbAt,innerAt,C};
}

// ---------- wheels ----------
function buildWheel(S,front){
  const W=S.wheels,R=front?W.rF:W.rR,rim=front?W.rimF:W.rimR,tw=front?W.twF:W.twR,h=tw/2;
  const st=Object.assign({style:'spoke',n:5,w0:.045,w1:.05,conc:.035,dish:0,cap:'rim'},W.rimStyle);
  const parts=[];
  // tyre
  const sr=Math.min(.04,tw*.17),prof=[];
  const sw=(sgn)=>{const o=[];for(let k=0;k<=8;k++){const f=k/8,r=lerp(rim+.004,R-sr,f);o.push([r,sgn*h*(.86+.12*Math.sin(Math.PI*Math.min(1,f*1.15)))]);}return o;};
  const zs=h*.96-sr;
  const inner=sw(-1);prof.push(...inner);
  for(let k=1;k<=6;k++){const a=k/6*Math.PI/2;prof.push([R-sr+sr*Math.sin(a),-(zs+sr*Math.cos(a))]);}
  for(let k=1;k<10;k++)prof.push([R,-zs+2*zs*k/10]);
  for(let k=0;k<=5;k++){const a=(1-k/6)*Math.PI/2;prof.push([R-sr+sr*Math.sin(a),zs+sr*Math.cos(a)]);}
  prof.push(...sw(1).reverse());
  parts.push(lathe('tire',prof,64));
  const fz=h*.8, conc=st.conc, dish=st.dish;
  // lip + barrel + dark back
  parts.push(lathe('rim',[[rim+.003,fz-.03],[rim+.013,fz-.012],[rim+.011,fz+.003],[rim-.002,fz+.006],[rim-.01,fz-.002],[rim-.01-dish*.3,fz-.004-dish*.5],[rim-.012-dish,fz-.008-dish*.6]],96));
  parts.push(lathe('rimInner',[[rim-.012-dish,fz-.008-dish*.6],[rim-.016-dish,fz-.03-dish*.6],[rim-.02,-h*.75]],48));
  parts.push(lathe('void',[[0,-h*.55],[rim-.018,-h*.55]],32));
  const r0=.075,r1=rim-.009-dish,fzS=fz-dish*.6;
  const zf=r=>fzS-.004-conc*Math.pow(1-clamp((r-r0)/(r1-r0),0,1),1.4);
  // brake disc + caliper
  const bz=zf(r0)-.05;
  parts.push(lathe('disc',[[.09,bz],[rim*.8,bz],[rim*.8,bz-.026],[.09,bz-.026]],48));
  parts.push(lathe('rimInner',[[0,bz+.012],[.085,bz+.012],[.09,bz]],24));
  {const c=rbox('caliper',.034,.075,.026,.22),a=front?.75:.65;
    c.xf(M3.rz(a),[Math.cos(a)*rim*.72,Math.sin(a)*rim*.72,bz+.028]);parts.push(c);}
  // face
  const face=new Part('rim');
  function spoke(a0,twist,w0,w1,depth=.022,crown=.004){
    const n=10,rows=[];
    for(let i=0;i<=n;i++){const f=i/n,r=lerp(r0-.005,r1,f),a=a0+twist*f,w=lerp(w0,w1,f),z=zf(r);
      const c=[Math.cos(a),Math.sin(a)],t=[-Math.sin(a),Math.cos(a)];
      rows.push({l:[c[0]*r-t[0]*w/2,c[1]*r-t[1]*w/2],m:[c[0]*r,c[1]*r],rt:[c[0]*r+t[0]*w/2,c[1]*r+t[1]*w/2],z});}
    grid(face,n+1,3,(i,j)=>{const q=rows[i],p=j===0?q.l:j===1?q.m:q.rt;return [p[0],p[1],q.z+(j===1?crown:0)];});
    for(const k of ['l','rt'])grid(face,n+1,2,(i,j)=>{const q=rows[i];return [q[k][0],q[k][1],q.z-(j?depth:0)];});
  }
  function disc(prof){face.append(lathe('rim',prof,96));}
  if(st.style==='spoke'||st.style==='classic'){for(let k=0;k<st.n;k++)spoke(k/st.n*Math.PI*2+(st.rot||0),st.twist||0,st.w0,st.w1);}
  else if(st.style==='split'){const sH=st.sepH||.03,sR=st.sepR||.12;
    for(let k=0;k<st.n;k++){const a=k/st.n*Math.PI*2;spoke(a-sH,-(sR-sH)+(st.twist||0),st.w0,st.w1);spoke(a+sH,(sR-sH)+(st.twist||0),st.w0,st.w1);}}
  else if(st.style==='disc'||st.style==='steel'||st.style==='holes'){
    const pr=[];for(let k=0;k<=10;k++){const r=lerp(r0-.01,r1+.004,k/10);pr.push([r,zf(r)+(st.style==='steel'?.012*Math.sin(Math.PI*k/10):0)]);}
    disc(pr);
    if(st.style==='disc'){for(let k=0;k<st.n;k++)spoke(k/st.n*Math.PI*2,st.twist||.7,st.w0||.018,st.w1||.03,.006,.002);}
    else{const hp=new Part('void');for(let k=0;k<st.n;k++){const a=k/st.n*Math.PI*2+.3,r=lerp(r0,r1,st.holeR||.55);
      const hl=lathe('void',[[0,0],[st.hole||.026,0]],20);hl.xf(M3.I(),[Math.cos(a)*r,Math.sin(a)*r,zf(r)+(st.style==='steel'?.012:0)+.0015]);hp.append(hl);}
      parts.push(hp);}
  }
  face.normals();parts.push(face);
  // hub cap + lug nuts
  const hz=zf(r0);
  if(st.cap==='chrome'){parts.push(lathe('chrome',[[0,hz+.05],[.06,hz+.042],[.1,hz+.025],[.115,hz+.004],[.118,hz-.01]],40));}
  else{parts.push(lathe(st.capMat||'rim',[[0,hz+.016],[.03,hz+.015],[.055,hz+.009],[.07,hz-.002],[.078,hz-.012]],32));
    for(let k=0;k<5;k++){const a=k/5*Math.PI*2+.6;parts.push(cyl('chrome',[Math.cos(a)*.052,Math.sin(a)*.052,hz+.004],[Math.cos(a)*.052,Math.sin(a)*.052,hz+.016],.009,.007,8));}}
  return parts;
}

// ---------- decals projected onto the body ----------
function makeDecal(api,shape0,mat,frame,layer=0){
  // densify the outline so long edges follow curved panels instead of cutting through them
  const shape=[];for(let i=0;i<shape0.length;i++){const a=shape0[i],b=shape0[(i+1)%shape0.length],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/.014));
    for(let k=0;k<n;k++)shape.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n]);}
  const N=shape.length,K=6;let cu=0,cv=0;for(const s of shape){cu+=s[0];cv+=s[1];}cu/=N;cv/=N;
  const pts=[[cu,cv]];for(let k=1;k<=K;k++)for(const s of shape)pts.push([cu+(s[0]-cu)*k/K,cv+(s[1]-cv)*k/K]);
  const p=new Part(mat),off=.0022+layer*.0026;let miss=0,tg=-1;
  for(const [u,v] of pts){let o=frame.o(u,v),h=api.ray(o,frame.d,frame.maxT,tg);
    // edge fallback: slide the ray toward the body until it lands (wraps the decal onto the silhouette edge)
    for(let k=1;!h&&k<=40;k++){const q=frame.shrink(u,v,k);o=frame.o(q[0],q[1]);h=api.ray(o,frame.d,frame.maxT);}
    if(!h){miss++;p.v(o[0],o[1],o[2],u,v);continue;}
    tg=Math.hypot(h[0]-o[0],h[1]-o[1],h[2]-o[2]);
    p.v(h[0]-frame.d[0]*off,h[1]-frame.d[1]*off,h[2]-frame.d[2]*off,u,v);}
  if(miss){console.warn('decal miss',mat,miss);return null;}
  for(let j=0;j<N;j++)p.t(0,1+j,1+(j+1)%N);
  for(let k=1;k<K;k++){const a=1+(k-1)*N,b=1+k*N;for(let j=0;j<N;j++){const j2=(j+1)%N;p.q(a+j,a+j2,b+j2,b+j);}}
  return p.normals();
}
// projection frames
const FR={
  F:(L)=>({maxT:.75,d:[1,0,0],o:(u,v)=>[-.4,v,u],shrink:(u,v,k)=>[u*(1-.015*k),v]}),
  R:(L)=>({maxT:.75,d:[-1,0,0],o:(u,v)=>[L+.4,v,u],shrink:(u,v,k)=>[u*(1-.015*k),v]}),
  S:(L,sg=1)=>({maxT:1.1,d:[0,0,-sg],o:(u,v)=>[u,v,sg*1.4],shrink:(u,v,k)=>[u,v+(.55-v)*.02*k]}),
  // tilted front/rear projections for lights that sit on sloping noses/decks:
  // the outline is drawn as seen from the front at the plane x=xr; rays come down at `deg` degrees.
  FT:(L,deg,xr)=>{const a=deg*Math.PI/180,d=[Math.cos(a),-Math.sin(a),0];return {maxT:1.1,d,o:(u,v)=>[xr-d[0]*.55,v-d[1]*.55,u],shrink:(u,v,k)=>[u*(1-.015*k),v]};},
  RT:(L,deg,xr)=>{const a=deg*Math.PI/180,d=[-Math.cos(a),-Math.sin(a),0];return {maxT:1.1,d,o:(u,v)=>[xr-d[0]*.55,v-d[1]*.55,u],shrink:(u,v,k)=>[u*(1-.015*k),v]};},
  T:(L)=>({maxT:2.5,d:[0,-1,0],
o:(u,v)=>[u,2.6,v],shrink:(u,v,k)=>[u,v*(1-.015*k)]}),
  // corner frame for wrap-around lights: yaw 0 = straight on (front/rear), 90 = from the side.
  // u is measured along the horizontal axis perpendicular to the ray, from the front (x=0) or rear (x=L) centre.
  Y:(L,yaw,rear=false,sg=1)=>{const a=yaw*Math.PI/180,s=Math.sin(a),c=Math.cos(a);
    const d=rear?[-c,0,-sg*s]:[c,0,-sg*s],uA=[s,0,sg*c],C=rear?[L,0,0]:[0,0,0];
    return {maxT:2.3,d,o:(u,v)=>[C[0]-d[0]*1.6+uA[0]*u,v,C[2]-d[2]*1.6+uA[2]*u],shrink:(u,v,k)=>[u*(1-.015*k),v]};}
};

// ---------- car assembly ----------
function buildCar(S){
  const t0=performance.now();
  const parts=[];
  // build the body; grow the fenders (flare + rise) until the arch cut-outs sit inside them and cover the tyres
  let res,fl=(S.body.flare||[0,0]).slice(),rb=(S.body.riseBoost||[0,0]).slice();const W0=S.wheels;
  for(let it=0;it<7;it++){S.body=Object.assign({},S.body,{flare:fl,riseBoost:rb});res=buildBody(S);let ok=true;if(S.body.lines)break;
    res.api.arches.forEach((a,i)=>{const zt=i?W0.zR+W0.twR/2:W0.zF+W0.twF/2,yt=a.cy+a.Ra;
      const def=Math.max(zt+.008-res.api.hwAt(a.x,yt+.02),zt+.002-res.api.hwAt(a.x,yt+.045));
      if(def>.002){ok=false;fl[i]+=def*.75;rb[i]+=def*.9;}});
    if(ok)break;}
  const {body,api,liner}=res;parts.push(body);parts.push(liner);
  const cab=buildCabin(S,api);parts.push(cab.cabin);api.cab=cab;
  const W=S.wheels;
  // wheels
  for(const front of [true,false]){const wp=buildWheel(S,front),x=front?W.xF:W.xR,R=front?W.rF:W.rR,z=front?W.zF:W.zR,steer=front?(W.steer||0):0;
    for(const sg of [1,-1]){const m=sg>0?M3.ry(steer):M3.mul(M3.ry(steer),M3.sc(1,1,-1));
      for(const q of wp){const c=q.clone();c.xf(m,[x,R,sg*z]);parts.push(c);}}}
  // decals + parts from spec
  const kit=makeKit(api,S,parts);
  if(S.extras)S.extras(kit,api);
  let cut=null;if(S.interior&&typeof buildInterior==='function')cut=buildInterior(S,api,cab,kit,parts);
  console.log(S.id,'built in',Math.round(performance.now()-t0),'ms');
  return {parts,api,cut};

}

// helper kit given to each car's extras()
function makeKit(api,S,parts){
  const L=api.L;
  const add=p=>{if(p)parts.push(p);return p;};
  const sym=p=>{if(!p)return;parts.push(p);parts.push(mirrorZ(p));};
  const k={
    L,api,add,sym,
    F:(shape,mat,layer=0,mirror=true,tilt=null)=>{const f=tilt?FR.FT(L,tilt[0],tilt[1]):FR.F(L);add(makeDecal(api,shape,mat,f,layer));if(mirror)add(makeDecal(api,shape.map(s=>[-s[0],s[1]]).reverse(),mat,f,layer));},
    R:(shape,mat,layer=0,mirror=true,tilt=null)=>{const f=tilt?FR.RT(L,tilt[0],tilt[1]):FR.R(L);add(makeDecal(api,shape,mat,f,layer));if(mirror)add(makeDecal(api,shape.map(s=>[-s[0],s[1]]).reverse(),mat,f,layer));},
    S:(shape,mat,layer=0,both=true)=>{add(makeDecal(api,shape,mat,FR.S(L,1),layer));if(both)add(makeDecal(api,shape,mat,FR.S(L,-1),layer));},
    T:(shape,mat,layer=0,mirror=true)=>{add(makeDecal(api,shape,mat,FR.T(L),layer));if(mirror)add(makeDecal(api,shape.map(s=>[s[0],-s[1]]),mat,FR.T(L),layer));},
    Yf:(yaw,shape,mat,layer=0)=>{add(makeDecal(api,shape,mat,FR.Y(L,yaw,false,1),layer));add(makeDecal(api,shape,mat,FR.Y(L,yaw,false,-1),layer));},
    Yr:(yaw,shape,mat,layer=0)=>{add(makeDecal(api,shape,mat,FR.Y(L,yaw,true,1),layer));add(makeDecal(api,shape,mat,FR.Y(L,yaw,true,-1),layer));},
    rbox:(mat,c,h,e=.3,rot=null)=>{const p=rbox(mat,h[0],h[1],h[2],e);p.xf(rot||M3.I(),c);return p;},
    cyl:(mat,a,b,r0,r1,segs)=>cyl(mat,a,b,r0,r1,segs),
    // point on body side surface at (x,y)
    sideZ:(x,y)=>api.hwAt(x,y),
    topY:(x,z=0)=>api.topY(x,z),
    roofY:x=>api.cab.roofF(x),
    // exhaust tip pointing rearward
    exhaust:(z,y,r,len=.12,mat='chrome',shape='round')=>{const x=L-.02;
      const tip=lathe(mat,[[r*.82,0],[r,0],[r,len],[r*1.04,len+.004],[r*.86,len+.006],[r*.82,len*.4]],28);
      tip.xf(M3.basis([0,0,1],[0,1,0],[1,0,0]),[x-len*.55,y,z]);
      const inner=lathe('void',[[0,len*.35],[r*.83,len*.35]],20);inner.xf(M3.basis([0,0,1],[0,1,0],[1,0,0]),[x-len*.55,y,z]);
      add(tip);add(inner);add(cyl('rimInner',[L-.32,y+.005,z*.95],[x-len*.5,y,z],r*.75,r*.75,12));},
    // airfoil wing spanning z, chord along x
    wing:(mat,xLead,y,span,chord,thick,aoa=.12)=>{const pf=[];const n=16;
      for(let i=0;i<=n;i++){const t=i/n,xx=t*chord,yy=thick*5*chord*(.2969*Math.sqrt(t)-.126*t-.3516*t*t+.2843*t*t*t-.1015*t*t*t*t);pf.push([xx,yy*1.0]);}
      const loop=pf.concat(pf.slice(1,-1).reverse().map(p=>[p[0],-p[1]*.35]));
      const rot=loop.map(([a,b])=>[a*Math.cos(aoa)+b*Math.sin(aoa),-a*Math.sin(aoa)+b*Math.cos(aoa)]);
      const p=extrude(mat,rot,-span,span,true);p.xf(M3.I(),[xLead,y,0]);return add(p);},
    mirrorPart:(x,y,matCap,matArm='trim',size=[.085,.06,.115])=>{
      const yb=api.cab.baseY(x),z=Math.max(api.hwAt(x,yb-.04),api.hwAt(x,yb-.1))-.015,yc=yb+.02+size[1];
      const cap=rbox(matCap,size[0],size[1],size[2],.38);cap.xf(M3.ry(-.1),[x+.03,yc,z+size[2]*.72]);
      const gl=rbox('chrome',.01,size[1]*.8,size[2]*.84,.25);gl.xf(M3.ry(-.1),[x+.03+size[0]*.93,yc,z+size[2]*.72]);

      const arm=rbox(matArm,.045,.016,.055,.3);arm.xf(M3.I(),[x+.02,yb+.02,z+.03]);
      sym(cap);sym(gl);sym(arm);},
    // diffuser strakes that hang from the rising rear floor
    diffuser:(zs,len,drop,mat)=>{const x0=L-len,x1=L-.015,c=x=>api.sec(x).bot;
      for(const z of zs){const p=new Part(mat),yt=i=>c(lerp(x0,x1,i/10))+.01,yb=i=>{const f=i/10;return c(lerp(x0,x1,f))-drop*f*f;};
        for(const dz of [-.005,.005])grid(p,11,2,(i,j)=>[lerp(x0,x1,i/10),j?yb(i):yt(i),z+dz]);
        grid(p,11,2,(i,j)=>[lerp(x0,x1,i/10),yb(i),z+(j?.005:-.005)]);
        grid(p,2,2,(i,j)=>[x1,i?yb(10):yt(10),z+(j?.005:-.005)]);
        add(p.normals());}},

    // carbon side blade along the sill between the wheels
    skirt:(x0,x1,mat='carbon',out=.02,h=.035)=>{if(!api.LN)return;const p=new Part(mat),N=60;
      grid(p,N+1,6,(i,j)=>{const x=lerp(x0,x1,i/N),sY=api.LN.sillY(x),z0=api.hwAt(x,sY+.005),t=smoothstep(0,.08,i/N)*smoothstep(0,.08,1-i/N),o=out*t;
        const pr=[[sY+.012,z0-.012],[sY+.002,z0+o*.55],[sY-.006,z0+o],[sY-h+.004,z0+o],[sY-h,z0+o*.6],[sY-h-.004,z0-.03]][j];return [x,pr[0],pr[1]];});
      p.normals();sym(p);},
    // door handle just below the window line
    handle:(x,mat='trim',w=.12)=>{const y=api.cab.baseY(x)-.075;k.S(rr(x,y,w,.024,.008),mat);},
    wipers:(n=2)=>{const x=api.cab.x0+.07,y=Math.max(api.cab.roofF(x-.035),api.cab.roofF(x+.035))+.014;
      for(const zc of [-.32,.22]){const w=rbox('trim',.012,.008,.27,.25);w.xf(M3.ry(.06),[x,y,zc]);add(w);}},
  };
  return k;
}

// flat panel facing n; uv in [-1,1] (unit) or metres
function panel(mat,c,n,up,w,h,metres=false){const nn=vnorm(n),u=vnorm(vcross(up,nn)),v=vcross(nn,u),p=new Part(mat);
  grid(p,3,3,(i,j)=>{const a=j-1,b=i-1;return [c[0]+u[0]*a*w/2+v[0]*b*h/2,c[1]+u[1]*a*w/2+v[1]*b*h/2,c[2]+u[2]*a*w/2+v[2]*b*h/2,metres?a*w/2:a,metres?b*h/2:b];});
  return p.normals();}
// tube swept along a polyline [[x,y,z]...]
function sweep(mat,path,r,closed=true,segs=12){const p=new Part(mat),n=path.length;
  const P=closed?path.concat([path[0]]):path,m=P.length;
  const T=P.map((q,i)=>{const a=P[Math.max(0,i-1)],b=P[Math.min(m-1,i+1)];let t=vsub(b,a);if(closed&&(i===0||i===m-1))t=vsub(path[1],path[n-1]);return vnorm(t);});
  const N=[vnorm(vcross(T[0],Math.abs(T[0][1])<.9?[0,1,0]:[1,0,0]))];
  for(let i=1;i<m;i++){const q=vsub(N[i-1],vmul(T[i],vdot(N[i-1],T[i])));N.push(vnorm(q));}
  grid(p,m,segs,(i,j)=>{const a=j/segs*Math.PI*2,B=vcross(T[i],N[i]);return vadd(P[i],vadd(vmul(N[i],Math.cos(a)*r),vmul(B,Math.sin(a)*r)));},true);
  if(!closed)for(const i of [0,m-1]){const c=p.v(...P[i]),s=p.count;for(let j=0;j<segs;j++){const a=j/segs*Math.PI*2,B=vcross(T[i],N[i]);p.v(...vadd(P[i],vadd(vmul(N[i],Math.cos(a)*r),vmul(B,Math.sin(a)*r))));}
    for(let j=0;j<segs;j++)p.t(c,s+j,s+(j+1)%segs);}
  return p.normals();}

  if(!cam.inside)document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed','false'));});
canvas.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);const dx=e.clientX-p[0],dy=e.clientY-p[1];ptrs.set(e.pointerId,[e.clientX,e.clientY]);lastInput=performance.now();
  if(cam.inside){if(ptrs.size===1){look.gy=clamp(look.gy+dx*.005,-2.4,2.4);look.gp=clamp(look.gp+dy*.004,-1,.7);}
    else if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch0>0)look.fov=clamp(zoom0*pinch0/d,.6,1.5);}return;}
  if(ptrs.size===1){goal.theta-=dx*.008;goal.phi=clamp(goal.phi+dy*.006,-.02,1.25);}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch0>0)goal.zoom=clamp(zoom0*pinch0/d,.45,1.8);}});
const up=e=>{ptrs.delete(e.pointerId);pinch0=0;};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();if(cam.inside)look.fov=clamp(look.fov*Math.exp(e.deltaY*.001),.6,1.5);else goal.zoom=clamp(goal.zoom*Math.exp(e.deltaY*.001),.45,1.8);lastInput=performance.now();},{passive:false});

let tPrev=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-tPrev)/1000);tPrev=now;
  resize();
  if(cam.inside&&R.eye){const k2=1-Math.exp(-dt*10);look.yaw+=(look.gy-look.yaw)*k2;look.pitch+=(look.gp-look.pitch)*k2;
    const L=R.carInfo.L,e=R.eye;cam.eye=[e[0]-L/2,e[1],e[2]];const cp=Math.cos(look.pitch);
    cam.target=[cam.eye[0]-Math.cos(look.yaw)*cp,cam.eye[1]+Math.sin(look.pitch),cam.eye[2]+Math.sin(look.yaw)*cp];cam.fov=look.fov;cam.offX=cam.offY=0;cam.exp=1.45;
    if(gl)drawScene(cam,now/1000);requestAnimationFrame(frame);return;}
  cam.fov=30*Math.PI/180;cam.exp=1.05;

  if(autoSpin||now-lastInput>9000){autoSpin=true;goal.theta+=dt*.16;}

  const k=1-Math.exp(-dt*7);cam.theta+=(goal.theta-cam.theta)*k;cam.phi+=(goal.phi-cam.phi)*k;cam.zoom+=(goal.zoom-cam.zoom)*k;
  cam.offX=window.innerWidth>=900?-.24:0;cam.offY=window.innerWidth>=900?0:-.04;
  const d=fitDist()*cam.zoom*(window.innerWidth>=900?1.12:1);const ty=.52;cam.target=window.__tgt||[0,ty,0];

  cam.eye=[-Math.cos(cam.theta)*Math.cos(cam.phi)*d,ty+Math.sin(cam.phi)*d,Math.sin(cam.theta)*Math.cos(cam.phi)*d];
  if(gl)drawScene(cam,now/1000);
  requestAnimationFrame(frame);
}
if(gl){
  let start='kestrel';try{start=localStorage.getItem('rr-garage-car')||start;}catch(e){}
  const h=location.hash.slice(1);if(CARS.some(c=>c.id===h))start=h;if(!CARS.some(c=>c.id===start))start=CARS[0].id;
  select(start,true);setView('3/4',true);autoSpin=true;
  window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==current.id&&CARS.some(c=>c.id===h))select(h);});
  requestAnimationFrame(frame);
}
// test hooks
window.__show=(id,v)=>{select(id,true);setView(v||'3/4',true);autoSpin=false;lastInput=performance.now()+1e9;};
window.__look=(y,p,f)=>{look.yaw=look.gy=y;look.pitch=look.gp=p;if(f)look.fov=f;};

window.__orbit=(th,ph,z)=>{cam.theta=goal.theta=th;cam.phi=goal.phi=ph;cam.zoom=goal.zoom=z||1;autoSpin=false;lastInput=performance.now()+1e9;};

</script>
</body>
</html>
